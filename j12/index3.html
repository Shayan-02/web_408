<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
  border: 1px solid gray ;
  background-color: rgb(222, 219, 219);
  border-radius: 10px;
  box-shadow: 5px 6px 10px rgb(78, 78, 78);
  padding: 5px;
}
.image-cover{
  overflow: hidden;
  border-radius: 10px;
  width: 300px;
  height: 400px;
}
img{
  width: 300px;
  height: 400px;
  transition: all ease 1s;
}
img:hover{
  transform: scale(2.8);
}
.details{
  display: flex;
  justify-content: center;
}
    </style>
</head>
<body>
    <div class="card">
    <div class="image-cover">
        <img src="./../j01/assets/images/flower.webp" alt=""/>
    </div>
    <div class="details">
        انتخاب کارت 
    </div>
</div>
</body>
</html>
