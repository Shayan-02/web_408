<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 150px;
      height: 150px;
      margin: 50px;
      background: white;
      border-radius: 10px;
      box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3),
                  inset 0 0 10px rgba(0, 0, 0, 0.1);
      transition: box-shadow 1s ease;
    }
    .box:hover {
      box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5),
                  inset 0 0 15px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
