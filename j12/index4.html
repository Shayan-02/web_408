<!DOCTYPE html>
<html>
<head>
  <style>
    .box {
      width: 150px;
      height: 150px;
      background: #3498db;
      margin: 50px;
      border-radius: 10px;
      transition: transform 10s ease, box-shadow 0.4s ease;
    }

    .box:hover {
      transform: translateY(-10px) scale(1.1) rotate(960deg);
      box-shadow: 0 20px 20px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
